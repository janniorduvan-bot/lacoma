<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/estilo.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
      <title>LA COMA 🎮</title>

</head>
<body>
{% include 'navbar.html' %}

<!-- MENSAJES FLASH -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show auto-dismiss-alert" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<section class="registro-section page-surface">
  <div class="registro-container">
    <div class="card registro-card">
      <div class="card-body">
        <h1 class="registro-titulo">CREAR CUENTA</h1>

        <form class="row g-3 registro-form" method="POST" action="{{ url_for('registrar_usuario') }}">
          <div class="col-12">
            <label for="inputEmail4" class="form-label">Email</label>
            <input type="email" class="form-control" id="inputEmail4" name="email" required>
          </div>
          <div class="col-12">
            <label for="inputPassword4" class="form-label">Contraseña</label>
            <div class="password-field">
              <input type="password" class="form-control" id="inputPassword4" name="password" autocomplete="new-password" required>
              <button type="button" class="password-toggle" data-password-target="inputPassword4" aria-label="Mostrar contraseña" title="Mostrar contraseña">Mostrar</button>
            </div>
          </div>
          <div class="col-12">
            <label for="inputNombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="inputNombre" name="nombre" placeholder="Tu nombre" required>
          </div>
          <div class="col-12">
            <label for="inputUsername" class="form-label">Nombre de usuario</label>
            <input type="text" class="form-control" id="inputUsername" name="username" placeholder="Ejemplo: jugador_01" maxlength="50" required>
          </div>
          <div class="col-12">
            <label for="inputCity" class="form-label">Ciudad</label>
            <input type="text" class="form-control" id="inputCity" name="city">
          </div>
          <div class="col-12 captcha-field">
            <div class="form-check captcha-check">
              <input class="form-check-input" type="checkbox" id="registerCaptcha" name="not_robot" required>
              <label class="form-check-label" for="registerCaptcha">No soy un robot</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="gridCheck" name="terms" required>
              <label class="form-check-label" for="gridCheck">Acepto los términos y condiciones</label>
            </div>
          </div>
          <div class="col-12 registro-actions">
            <button type="submit" class="btn btn-registro btn-primary-cta">Registrarse</button>
          </div>
          <div class="col-12 account-switch">
            <span>¿Ya tienes una cuenta?</span>
            <a href="{{ url_for('iniciarsesion') }}">Inicia sesión</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
    {% include 'footer.html' %}
    <script>
      document.querySelectorAll('[data-password-target]').forEach(function (button) {
        button.addEventListener('click', function () {
          const input = document.getElementById(button.dataset.passwordTarget);
          const visible = input.type === 'text';
          input.type = visible ? 'password' : 'text';
          button.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
          button.setAttribute('title', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
          button.textContent = visible ? 'Mostrar' : 'Ocultar';
        });
      });
    </script>
