<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/estilo.css') }}">
  <script defer src="{{ url_for('static', filename='JS/app.js') }}"></script>
  <title>Editar Recompensa - LA COMA</title>
</head>
<body>
  {% include 'navbar.html' %}
  <div class="container py-5">
    <h3>Editar Comentario de Recompensa Semanal</h3>
    <form method="post" class="recompensa-edit-form">
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input name="titulo" class="form-control" value="{{ post[1] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contenido</label>
        <textarea name="contenido" class="form-control" rows="6" required>{{ post[2] }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Cartas necesarias por juego:</label>
        <div class="card-requirements-picker" data-card-requirements>
          {% for game_name in card_game_names %}
          {% set game_key = game_name|lower %}
          <label class="card-requirement-row">
            <span>{{ game_name }}</span>
            <input type="number" min="0" max="500" value="{{ card_requirements.get(game_key, 0) }}" data-game="{{ game_name }}">
          </label>
          {% endfor %}
        </div>
        <input type="hidden" name="requisitos_cartas" value="{{ post[4] }}" data-requirements-output>
        <label class="form-label mt-3">Total de cartas necesarias:</label>
        <input type="number" name="precio_cartas" class="form-control" min="1" max="500" value="{{ post[3] }}" readonly required data-requirements-total>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="destacada" id="recompensaDestacada" value="1"{% if post[5] %} checked{% endif %}>
        <label class="form-check-label" for="recompensaDestacada">Marcar como recompensa destacada</label>
      </div>
      <div>
        <button class="btn btn-primary">Guardar cambios</button>
        <a href="{{ url_for('cartas') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</body>
</html>
