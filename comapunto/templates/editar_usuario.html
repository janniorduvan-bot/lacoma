<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/estilo.css') }}">
  <title>Actualizar usuario</title>
</head>
<body>
{% include 'navbar.html' %}

<section class="usuarios-section">
  <div class="usuarios-container edit-user-page">
    <h1 class="usuarios-titulo edit-user-title">ACTUALIZAR USUARIO</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show auto-dismiss-alert mt-3" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('actualizar_usuario', id=usuario[0]) }}" method="post" class="edit-user-card">
      <div class="mb-3">
        <label class="form-label edit-user-label">Nuevo Nombre</label>
        <input type="text" id="nuevo_nombre" name="nuevo_nombre" class="form-control" value="{{ usuario[1] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label edit-user-label">Nuevo Email</label>
        <input type="email" id="nuevo_email" name="nuevo_email" class="form-control" value="{{ usuario[2] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label edit-user-label">Nueva Contraseña</label>
        <input type="password" id="nueva_contraseña" name="nueva_contraseña" class="form-control" placeholder="Deja en blanco para conservar la contraseña actual">
      </div>
      <div class="mb-3">
        <label class="form-label edit-user-label">Rol</label>
        <select id="nuevo_rol" name="nuevo_rol" class="form-control">
          <option value="0" {% if usuario[4] == 0 %}selected{% endif %}>Usuario</option>
          <option value="1" {% if usuario[4] == 1 %}selected{% endif %}>Administrador</option>
        </select>
      </div>
      <div class="edit-user-actions">
        <button type="submit" class="btn-actualizar">Actualizar</button>
        <a href="{{ url_for('usuarios') }}" class="back-link">Volver</a>
      </div>
    </form>
  </div>
</section>

{% include 'footer.html' %}
</body>
</html>
